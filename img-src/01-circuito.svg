<path d="M770 233 L780 240 L770 247 Z" fill="#FFD24A"/>
<line x1="1070" y1="240" x2="1170" y2="240" stroke="#FFD24A" stroke-width="4"/>
<path d="M1160 233 L1170 240 L1160 247 Z" fill="#FFD24A"/>
<path d="M1320 300 L1320 410 L545 410 L545 300" fill="none" stroke="#35D999" stroke-width="4"/>
<path d="M538 310 L545 300 L552 310 Z" fill="#35D999"/>
<text x="930" y="455" text-anchor="middle" fill="#8BE8C4" font-family="Archivo, Arial, 'DejaVu Sans', sans-serif" font-size="27" font-weight="600">taxas → fundo de seguro → Oracle Pool, Community Pool e queima → mais segurança e rendimento</text>
<text x="800" y="505" text-anchor="middle" fill="#64748B" font-family="Archivo, Arial, 'DejaVu Sans', sans-serif" font-size="24">Nenhum concorrente pode montar este circuito: nenhum é a casa do LUNC</text>
