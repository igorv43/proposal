<text x="800" y="490" text-anchor="middle" fill="#FFD24A" font-family="Archivo, Arial, 'DejaVu Sans', sans-serif" font-size="27" font-weight="600">A queima é paga pelo lucro, nunca pela segurança — e isso é código não governável</text>
